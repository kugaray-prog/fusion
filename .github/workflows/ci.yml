name: CI

# Runs on every push and pull request. No secrets or database needed --
# this is just a fast, cheap sanity check (dependencies install cleanly,
# every server-side file is at least syntactically valid) that catches an
# obvious mistake before it reaches a deploy workflow.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Syntax-check every server-side JS file
        run: |
          find . -name "*.js" \
            -not -path "./node_modules/*" \
            -not -path "./mobile/*" \
            -print0 | xargs -0 -n1 node --check
