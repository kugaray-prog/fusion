# GeoAttend -- local/self-hosted stack: the Node app + MySQL 8.
#
#   docker compose up -d --build        # build and start
#   docker compose exec app npm run seed  # first run only: admin + sample data
#
# The app reads everything else (JWT/session secrets, Google, mail) from .env.
# The DB_* values below override .env so the app talks to the "db" container
# over Docker's network (.env's localhost:3307 is for running `npm start` on
# this PC instead).

services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-geoattend_root}
      MYSQL_DATABASE: geoattend_pro
      TZ: Asia/Manila
    command: --default-time-zone=+08:00
    volumes:
      - db_data:/var/lib/mysql
      # Runs only when db_data is empty (first start), creating every table.
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    ports:
      - "3307:3306" # host 3307 so it doesn't clash with a local MySQL on 3306
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-geoattend_root}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-geoattend_root}
      DB_NAME: geoattend_pro
      PORT: 3000
      TZ: Asia/Manila
    ports:
      - "3000:3000"
    # Live-edit the code from Windows: nodemon polls (-L, since Docker doesn't
    # pass Windows file events through) and restarts on server code changes;
    # views/ and public/ edits just refresh the browser (services/devLiveReload.js).
    command: ["nodemon", "-L", "server.js"]
    volumes:
      - .:/app
      # Keep the image's Linux node_modules and models/ (w600k_r50.onnx is
      # downloaded at build time) instead of the Windows copies.
      - /app/node_modules
      - /app/models
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  # Expo dev server for the phone app (mobile/). Same as `npm run go` in
  # mobile/: prints a QR code to scan with Expo Go. HOST_LAN_IP (set in .env)
  # is this PC's Wi-Fi IPv4 from `ipconfig`; the phone uses it both to fetch
  # the bundle (port 8081) and to reach the API container (port 3000).
  #   docker compose logs -f expo     # shows the QR code
  #   docker compose attach expo      # interactive Expo keys (r = reload)
  expo:
    build: ./mobile
    restart: unless-stopped
    environment:
      REACT_NATIVE_PACKAGER_HOSTNAME: ${HOST_LAN_IP:?Set HOST_LAN_IP in .env to this PC's Wi-Fi IPv4 (ipconfig)}
      # Google Sign-In needs an https:// origin (Google rejects http://<LAN IP>
      # with redirect_uri_mismatch), so prefer the HTTPS tunnel when set.
      API_BASE_URL: ${MOBILE_API_BASE_URL:-http://${HOST_LAN_IP}:3000/api}
      EXPO_NO_TELEMETRY: "1"
      # Optional: an Expo access token (expo.dev > Account settings > Access
      # tokens) skips the "Log in / Proceed anonymously" prompt Expo shows
      # when a phone first connects, which otherwise blocks until answered.
      EXPO_TOKEN: ${EXPO_TOKEN:-}
    ports:
      - "8081:8081"
    volumes:
      # Live-edit mobile/ from Windows; keep the Linux node_modules from the
      # image instead of the Windows one in mobile/node_modules.
      - ./mobile:/app
      - expo_node_modules:/app/node_modules
      # Keeps the `npx expo login` session across container rebuilds; Expo Go
      # refuses to open the project if the phone is signed in and the CLI isn't.
      - expo_home:/root/.expo
    tty: true
    stdin_open: true
    depends_on:
      - app

  # HTTPS tunnel for MOBILE_API_BASE_URL (Google Sign-In on the phone), hosted
  # here instead of VS Code's Ports panel. Shares the app container's network,
  # so the tunnel's port 3000 is the app. One-time login (saved in a volume):
  #   docker compose run --rm tunnel login
  tunnel:
    build: ./docker/devtunnel
    restart: unless-stopped
    network_mode: "service:app"
    environment:
      DEVTUNNEL_ID: ${DEVTUNNEL_ID:-pq2qwb2x.asse}
    volumes:
      - devtunnel_home:/root
    depends_on:
      - app

  # One-shot release APK builder (see mobile/Dockerfile.apk). Not started by
  # `up`; run it with
  #   docker compose run --rm apk
  # and the APK lands in public/downloads/.
  apk:
    build:
      context: ./mobile
      dockerfile: Dockerfile.apk
    profiles: ["apk"]
    environment:
      API_BASE_URL: ${MOBILE_API_BASE_URL:-http://${HOST_LAN_IP}:3000/api}
      APK_NAME: ${APK_NAME:-GeoAttend.apk}
      APK_ARCHS: ${APK_ARCHS:-arm64-v8a}
      EXPO_NO_TELEMETRY: "1"
    volumes:
      - ./mobile:/src:ro
      - apk_work:/work
      - apk_gradle:/root/.gradle
      - ./public/downloads:/out

volumes:
  apk_work:
  apk_gradle:
  devtunnel_home:
  db_data:
  uploads:
  expo_node_modules:
  expo_home:
