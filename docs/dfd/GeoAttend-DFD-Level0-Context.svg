<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1330" viewBox="0 0 2000 1330"><defs><marker id="arr" viewBox="0 0 10 10" refX="9.2" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker></defs><rect x="0" y="0" width="2000" height="1330" rx="0" fill="#FFFFFF" stroke="none" stroke-width="1"/><text x="1000" y="46" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#0F1C6B" text-anchor="middle" dominant-baseline="central">Level 0 — Context Diagram</text><text x="1000" y="76" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#4B5563" text-anchor="middle" dominant-baseline="central">GeoAttend · the whole system as a single process</text><path d="M390,590 L790,590" fill="none" stroke="#222222" stroke-width="1.6" marker-end="url(#arr)"/><path d="M790,690 L390,690" fill="none" stroke="#222222" stroke-width="1.6" marker-end="url(#arr)"/><path d="M1610,590 L1210,590" fill="none" stroke="#222222" stroke-width="1.6" marker-end="url(#arr)"/><path d="M1210,690 L1610,690" fill="none" stroke="#222222" stroke-width="1.6" marker-end="url(#arr)"/><path d="M880,470 L880,356 L255,356 L255,260" fill="none" stroke="#222222" stroke-width="1.6" marker-end="url(#arr)"/><path d="M420,195 L1258,195 L1258,430 L1120,430 L1120,470" fill="none" stroke="#222222" stroke-width="1.6" marker-end="url(#arr)"/><path d="M1140,470 L1140,332 L1755,332 L1755,260" fill="none" stroke="#222222" stroke-width="1.6" marker-end="url(#arr)"/><path d="M866,770 L866,902 L240,902 L240,970" fill="none" stroke="#222222" stroke-width="1.6" marker-end="url(#arr)"/><path d="M420,1064 L740,1064 L740,800 L962,800 L962,770" fill="none" stroke="#222222" stroke-width="1.6" marker-end="url(#arr)"/><rect x="790" y="470" width="420" height="300" rx="14" fill="#EAF1FF" stroke="#1D3494" stroke-width="2.2"/><line x1="790" y1="512" x2="1210" y2="512" stroke="#1D3494" stroke-width="1.6"/><text x="1000" y="491" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#1D3494" text-anchor="middle" dominant-baseline="central">0</text><text x="1000" y="621" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600" fill="#111111" text-anchor="middle" dominant-baseline="central">GeoAttend</text><text x="1000" y="641" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600" fill="#111111" text-anchor="middle" dominant-baseline="central">Geofenced Attendance</text><text x="1000" y="661" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600" fill="#111111" text-anchor="middle" dominant-baseline="central">Monitoring System</text><rect x="87" y="567" width="310" height="140" rx="6" fill="#E2CFA4" stroke="none" stroke-width="0"/><rect x="87" y="567" width="310" height="140" rx="6" fill="#E2CFA4" opacity="0.5"/><rect x="80" y="560" width="310" height="140" rx="6" fill="#FFF3D6" stroke="#8A5A12" stroke-width="2"/><text x="235" y="619.6" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#111111" text-anchor="middle" dominant-baseline="central">Employee</text><text x="235" y="640.4" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#111111" text-anchor="middle" dominant-baseline="central">(Mobile App)</text><rect x="1617" y="567" width="310" height="140" rx="6" fill="#E2CFA4" stroke="none" stroke-width="0"/><rect x="1617" y="567" width="310" height="140" rx="6" fill="#E2CFA4" opacity="0.5"/><rect x="1610" y="560" width="310" height="140" rx="6" fill="#FFF3D6" stroke="#8A5A12" stroke-width="2"/><text x="1765" y="619.6" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#111111" text-anchor="middle" dominant-baseline="central">Administrator /</text><text x="1765" y="640.4" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#111111" text-anchor="middle" dominant-baseline="central">Super Admin</text><rect x="97" y="137" width="330" height="130" rx="6" fill="#E2CFA4" stroke="none" stroke-width="0"/><rect x="97" y="137" width="330" height="130" rx="6" fill="#E2CFA4" opacity="0.5"/><rect x="90" y="130" width="330" height="130" rx="6" fill="#FFF3D6" stroke="#8A5A12" stroke-width="2"/><text x="255" y="185.25" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#111111" text-anchor="middle" dominant-baseline="central">Google Identity</text><text x="255" y="204.75" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#111111" text-anchor="middle" dominant-baseline="central">Services</text><rect x="1587" y="137" width="350" height="130" rx="6" fill="#E2CFA4" stroke="none" stroke-width="0"/><rect x="1587" y="137" width="350" height="130" rx="6" fill="#E2CFA4" opacity="0.5"/><rect x="1580" y="130" width="350" height="130" rx="6" fill="#FFF3D6" stroke="#8A5A12" stroke-width="2"/><text x="1755" y="185.25" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#111111" text-anchor="middle" dominant-baseline="central">Email Service</text><text x="1755" y="204.75" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#111111" text-anchor="middle" dominant-baseline="central">(Brevo / Apps Script)</text><rect x="97" y="977" width="330" height="130" rx="6" fill="#E2CFA4" stroke="none" stroke-width="0"/><rect x="97" y="977" width="330" height="130" rx="6" fill="#E2CFA4" opacity="0.5"/><rect x="90" y="970" width="330" height="130" rx="6" fill="#FFF3D6" stroke="#8A5A12" stroke-width="2"/><text x="255" y="1025.25" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#111111" text-anchor="middle" dominant-baseline="central">Public IP Resolver</text><text x="255" y="1044.75" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#111111" text-anchor="middle" dominant-baseline="central">(ipify / icanhazip)</text><rect x="560" y="1150" width="880" height="106" rx="8" fill="#FBFCFE" stroke="#CBD5E1" stroke-width="1.4" stroke-dasharray="5 4"/><text x="574" y="1168.6" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#1D3494" text-anchor="start" dominant-baseline="central">Reading this diagram</text><text x="574" y="1185.8" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#4B5563" text-anchor="start" dominant-baseline="central">One process: every request is a single flow into or out of the system as a whole.</text><text x="574" y="1203" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#4B5563" text-anchor="start" dominant-baseline="central">Google sign-in, geo-fencing, OCR and face matching all run server-side. The mobile app</text><text x="574" y="1220.1999999999998" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#4B5563" text-anchor="start" dominant-baseline="central">only captures GPS, records a frame, and runs the liveness challenge on the device.</text><text x="574" y="1237.3999999999999" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#4B5563" text-anchor="start" dominant-baseline="central">The public-IP lookup only matters when an admin has configured an office-network allowlist.</text><rect opacity="0.93" x="503.5225" y="477" width="172.955" height="136" rx="3" fill="#FFFFFF" stroke="none" stroke-width="0"/><text x="590" y="488.125" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#4B5563" text-anchor="middle" dominant-baseline="central">Google ID token,</text><text x="590" y="504.375" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#4B5563" text-anchor="middle" dominant-baseline="central">registration</text><text x="590" y="520.625" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#4B5563" text-anchor="middle" dominant-baseline="central">details, ID photo, face</text><text x="590" y="536.875" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#4B5563" text-anchor="middle" dominant-baseline="central">selfie &amp;</text><text x="590" y="553.125" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#4B5563" text-anchor="middle" dominant-baseline="central">liveness result, device</text><text x="590" y="569.375" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#4B5563" text-anchor="middle" dominant-baseline="central">identity,</text><text x="590" y="585.625" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#4B5563" text-anchor="middle" dominant-baseline="central">GPS location &amp;</text><text x="590" y="601.875" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#4B5563" text-anchor="middle" dominant-baseline="central">heartbeats</text><rect opacity="0.93" x="503.5225" y="668.875" width="172.955" height="152.25" rx="3" fill="#FFFFFF" stroke="none" stroke-width="0"/><text x="590" y="680" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#4B5563" text-anchor="middle" dominant-baseline="central">session token, device</text><text x="590" y="696.25" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#4B5563" text-anchor="middle" dominant-baseline="central">approval</text><text x="590" y="712.5" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#4B5563" text-anchor="middle" dominant-baseline="central">status, active events &amp;</text><text x="590" y="728.75" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#4B5563" text-anchor="middle" dominant-baseline="central">geo-fences, time-in /</text><text x="590" y="745" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#4B5563" text-anchor="middle" dominant-baseline="central">time-out</text><text x="590" y="761.25" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#4B5563" text-anchor="middle" dominant-baseline="central">confirmation,</text><text x="590" y="777.5" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#4B5563" text-anchor="middle" dominant-baseline="central">face-verification</text><text x="590" y="793.75" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#4B5563" text-anchor="middle" dominant-baseline="central">prompts, attendance</text><text x="590" y="810" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#4B5563" text-anchor="middle" dominant-baseline="central">history</text><rect opacity="0.93" x="1325.5225" y="436.375" width="172.955" height="217.25" rx="3" fill="#FFFFFF" stroke="none" stroke-width="0"/><text x="1412" y="447.5" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#4B5563" text-anchor="middle" dominant-baseline="central">login / Google sign-in,</text><text x="1412" y="463.75" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#4B5563" text-anchor="middle" dominant-baseline="central">employee &amp;</text><text x="1412" y="480" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#4B5563" text-anchor="middle" dominant-baseline="central">department records,</text><text x="1412" y="496.25" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#4B5563" text-anchor="middle" dominant-baseline="central">event &amp;</text><text x="1412" y="512.5" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#4B5563" text-anchor="middle" dominant-baseline="central">geo-fence definitions,</text><text x="1412" y="528.75" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#4B5563" text-anchor="middle" dominant-baseline="central">device &amp;</text><text x="1412" y="545" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#4B5563" text-anchor="middle" dominant-baseline="central">admin approvals, kiosk</text><text x="1412" y="561.25" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#4B5563" text-anchor="middle" dominant-baseline="central">ID-card /</text><text x="1412" y="577.5" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#4B5563" text-anchor="middle" dominant-baseline="central">selfie scans, rating</text><text x="1412" y="593.75" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#4B5563" text-anchor="middle" dominant-baseline="central">edits, report</text><text x="1412" y="610" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#4B5563" text-anchor="middle" dominant-baseline="central">&amp; certificate requests,</text><text x="1412" y="626.25" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#4B5563" text-anchor="middle" dominant-baseline="central">system</text><text x="1412" y="642.5" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#4B5563" text-anchor="middle" dominant-baseline="central">settings</text><rect opacity="0.93" x="1332.6075" y="677" width="158.78500000000003" height="136" rx="3" fill="#FFFFFF" stroke="none" stroke-width="0"/><text x="1412" y="688.125" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#4B5563" text-anchor="middle" dominant-baseline="central">dashboard statistics,</text><text x="1412" y="704.375" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#4B5563" text-anchor="middle" dominant-baseline="central">alerts &amp;</text><text x="1412" y="720.625" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#4B5563" text-anchor="middle" dominant-baseline="central">notifications, record</text><text x="1412" y="736.875" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#4B5563" text-anchor="middle" dominant-baseline="central">lists,</text><text x="1412" y="753.125" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#4B5563" text-anchor="middle" dominant-baseline="central">verification results,</text><text x="1412" y="769.375" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#4B5563" text-anchor="middle" dominant-baseline="central">reports &amp;</text><text x="1412" y="785.625" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#4B5563" text-anchor="middle" dominant-baseline="central">exports, certificate</text><text x="1412" y="801.875" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#4B5563" text-anchor="middle" dominant-baseline="central">PDFs</text><rect opacity="0.93" x="475.98" y="328.875" width="180.04000000000002" height="22.25" rx="3" fill="#FFFFFF" stroke="none" stroke-width="0"/><text x="566" y="340" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#4B5563" text-anchor="middle" dominant-baseline="central">Google ID token (verify)</text><rect opacity="0.93" x="1196.7775" y="378.75" width="130.445" height="38.5" rx="3" fill="#FFFFFF" stroke="none" stroke-width="0"/><text x="1262" y="389.875" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#4B5563" text-anchor="middle" dominant-baseline="central">verified identity</text><text x="1262" y="406.125" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#4B5563" text-anchor="middle" dominant-baseline="central">(email, name)</text><rect opacity="0.93" x="1361.5225" y="298.875" width="172.955" height="22.25" rx="3" fill="#FFFFFF" stroke="none" stroke-width="0"/><text x="1448" y="310" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#4B5563" text-anchor="middle" dominant-baseline="central">admin account OTP email</text><rect opacity="0.93" x="461.98" y="876.875" width="180.04000000000002" height="22.25" rx="3" fill="#FFFFFF" stroke="none" stroke-width="0"/><text x="552" y="888" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#4B5563" text-anchor="middle" dominant-baseline="central">public IP lookup request</text><rect opacity="0.93" x="518.3199999999999" y="1028.875" width="123.36000000000001" height="22.25" rx="3" fill="#FFFFFF" stroke="none" stroke-width="0"/><text x="580" y="1040" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#4B5563" text-anchor="middle" dominant-baseline="central">server public IP</text></svg>